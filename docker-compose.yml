services:
  db:
    image: postgres:16-alpine
    container_name: attendly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendly
    ports:
      - '5432:5432'
    volumes:
      - attendly-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d attendly']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendly-data:
